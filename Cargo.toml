[package]
name = "brook-music-bot"
version = "0.1.0"
edition = "2021"
authors = ["Brook Music Bot Contributors"]
description = "Soul King Telegram Music Bot in Rust"

[dependencies]
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "io-util", "process", "signal"] }
teloxide = { version = "0.13", default-features = false, features = ["macros", "rustls"] }
axum = { version = "0.7", features = ["macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "5.5"
anyhow = "1.0"
thiserror = "1.0"
rand = "0.8"
url = "2.5"
urlencoding = "2.1"
base64 = "0.22"
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
ferogram = "0.6.5"
tgcalls = "0.2"
uuid = { version = "1.8", features = ["v4"] }

[profile.release]
opt-level = 3
lto = false
codegen-units = 12
panic = "unwind"
strip = true

